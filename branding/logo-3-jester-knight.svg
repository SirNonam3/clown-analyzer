  <circle cx="158" cy="92" r="14" fill="#ffc24b"/>
  <circle cx="356" cy="73" r="14" fill="#e02f45"/>
  <!-- clown nose on the muzzle -->
  <circle cx="146" cy="222" r="19" fill="url(#nose)"/>
  <circle cx="140" cy="215" r="5.5" fill="#fff" opacity="0.6"/>
  <!-- base -->
  <g fill="#f7f4ec">
    <rect x="150" y="354" width="212" height="30" rx="12"/>
    <rect x="132" y="378" width="248" height="34" rx="14"/>
