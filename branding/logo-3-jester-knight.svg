  <!-- mane -->
  <path d="M302 150 Q322 170 330 200 M318 204 Q338 226 342 256 M326 262 Q344 284 344 312"
        fill="none" stroke="#d8d2ea" stroke-width="7" stroke-linecap="round"/>
