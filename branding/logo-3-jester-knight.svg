    C 178 330, 188 304, 210 286
    C 222 276, 230 266, 232 254
    C 214 258, 190 258, 170 252
    C 152 247, 142 238, 140 226
    C 138 212, 146 202, 158 194
    L 214 146
    C 226 134, 240 122, 256 114
    L 272 84
    L 290 120
    C 330 134, 360 176, 366 230
    C 372 290, 352 330, 346 356 Z"/>
  <use href="#k" fill="#1d1640" opacity="0.18" transform="translate(6 10)"/>
